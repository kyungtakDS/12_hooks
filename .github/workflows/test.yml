name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 이 프로젝트는 런타임 의존성이 없다 (표준 라이브러리만).
      # 매니페스트가 없으므로 개발 의존성인 pytest 만 직접 설치한다.
      - name: pytest 설치
        run: python -m pip install --upgrade pip pytest

      - name: 테스트
        run: python -m pytest scripts/ -q
